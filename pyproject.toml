[project]
name = "acc-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Adobe Campaign Classic v7"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
acc-mcp-server = "acc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_mcp"]
